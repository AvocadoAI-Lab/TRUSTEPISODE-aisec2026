<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="670" viewBox="0 0 1800 670">
  <defs>
    <style>
      .title{font:700 40px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.zone{font:700 27px Arial,DejaVu Sans,sans-serif;letter-spacing:1px;fill:#475569}.h{font:700 28px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.b{font:400 25px Arial,DejaVu Sans,sans-serif;fill:#334155}.s{font:400 22px Arial,DejaVu Sans,sans-serif;fill:#475569}.blue{stroke:#2563eb;stroke-width:4;fill:none}.teal{stroke:#0f766e;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1800" height="670" fill="#fff"/>
  <text x="55" y="45" class="title">Partial telemetry: paired replay vs. physical outage</text>

  <rect x="55" y="78" width="285" height="156" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="198" y="122" text-anchor="middle" class="h">Frozen base run</text>
  <text x="198" y="160" text-anchor="middle" class="b">events + health</text>
  <text x="198" y="198" text-anchor="middle" class="s">fixed label / split / cluster</text>

  <rect x="380" y="72" width="1365" height="338" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="415" y="112" class="zone">PAIRED REPLAY - EVENT STREAM CHANGES, HEALTH FIXED</text>
  <g>
    <rect x="420" y="142" width="285" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="563" y="178" text-anchor="middle" class="h">RP1 Source mask</text><text x="563" y="207" text-anchor="middle" class="s">EDR-only / NDR-only</text>
    <rect x="745" y="142" width="285" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="888" y="178" text-anchor="middle" class="h">RP2 Event drop</text><text x="888" y="207" text-anchor="middle" class="s">5 / 10 / 25%</text>
    <rect x="1070" y="142" width="285" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="1213" y="178" text-anchor="middle" class="h">RP3 Burst drop</text><text x="1213" y="207" text-anchor="middle" class="s">30 / 120 / 300 s</text>
    <rect x="1395" y="142" width="310" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="1550" y="178" text-anchor="middle" class="h">RP4 Ingest delay</text><text x="1550" y="207" text-anchor="middle" class="s">30 / 120 / 600 s</text>
    <rect x="420" y="252" width="285" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="563" y="288" text-anchor="middle" class="h">RP5 Reorder</text><text x="563" y="317" text-anchor="middle" class="s">30 / 120 / 600 s</text>
    <rect x="745" y="252" width="285" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="888" y="288" text-anchor="middle" class="h">RP6 Clock skew</text><text x="888" y="317" text-anchor="middle" class="s">fixed event-time shift</text>
    <rect x="1070" y="252" width="285" height="84" rx="13" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="1213" y="288" text-anchor="middle" class="h">RP7 Duplicate roots</text><text x="1213" y="317" text-anchor="middle" class="s">deterministic PRF</text>
    <rect x="1395" y="252" width="310" height="84" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="1550" y="288" text-anchor="middle" class="h">RP0 Control</text><text x="1550" y="317" text-anchor="middle" class="s">byte-identical replay</text>
  </g>
  <path d="M340 156 H380" class="blue"/>
  <rect x="420" y="355" width="1285" height="36" rx="9" fill="#dbeafe"/>
  <text x="1063" y="381" text-anchor="middle" class="b">Same immutable trace, label, split, and campaign cluster</text>

  <rect x="55" y="438" width="1690" height="126" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="85" y="476" class="zone">PHYSICAL OUTAGE - AUTHENTICATED HEALTH CHANGES</text>
  <rect x="105" y="494" width="330" height="50" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="270" y="528" text-anchor="middle" class="h">EDR/NDR x 120/600 s</text>
  <rect x="520" y="494" width="275" height="50" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="658" y="528" text-anchor="middle" class="h">10 traces / cell</text>
  <rect x="880" y="494" width="305" height="50" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="1033" y="528" text-anchor="middle" class="h">Stop source egress</text>
  <rect x="1270" y="494" width="420" height="50" rx="11" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="1480" y="528" text-anchor="middle" class="h">TrustEpisode + OB1, same trace</text>
  <path d="M435 519 H520" class="teal"/><path d="M795 519 H880" class="teal"/><path d="M1185 519 H1270" class="teal"/>

  <rect x="55" y="595" width="1690" height="56" rx="13" fill="#fff" stroke="#475569" stroke-width="2.5"/>
  <text x="900" y="630" text-anchor="middle" class="h">Report formation, revisions, eligibility, calibration, recovery, and decision coverage separately</text>
</svg>

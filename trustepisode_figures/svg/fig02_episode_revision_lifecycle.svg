<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="500" viewBox="0 0 1800 500">
  <defs>
    <style>
      .title{font:700 40px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.h{font:700 35px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.b{font:400 34px Arial,DejaVu Sans,sans-serif;fill:#334155}.mono{font:600 34px 'DejaVu Sans Mono',monospace;fill:#334155}.axis{stroke:#64748b;stroke-width:4;marker-end:url(#a)}.violet{stroke:#7c3aed;stroke-width:5;fill:none;marker-end:url(#v)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker>
    <marker id="v" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1800" height="500" fill="#fff"/>
  <text x="55" y="42" class="title">Deterministic episode and revision lifecycle</text>

  <rect x="55" y="62" width="1690" height="60" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="102" class="h">Controls:</text>
  <text x="300" y="102" class="b">W_gap linkage</text>
  <text x="670" y="102" class="b">W_max episode span</text>
  <text x="1150" y="102" class="b">fixed late-evidence horizon</text>

  <text x="55" y="177" class="h">Event time</text>
  <line x1="265" y1="166" x2="1715" y2="166" class="axis"/>
  <circle cx="430" cy="166" r="13" fill="#2563eb"/><text x="430" y="151" text-anchor="middle" class="mono">e1</text>
  <circle cx="710" cy="166" r="13" fill="#2563eb"/><text x="710" y="151" text-anchor="middle" class="mono">e2</text>
  <circle cx="1030" cy="166" r="13" fill="#2563eb"/><text x="1030" y="151" text-anchor="middle" class="mono">e3</text>
  <circle cx="1340" cy="166" r="13" fill="#7c3aed"/><text x="1340" y="151" text-anchor="middle" class="mono">late e4</text>
  <circle cx="1620" cy="166" r="13" fill="#dc2626"/><text x="1620" y="151" text-anchor="middle" class="mono">late e5</text>
  <path d="M430 190 V213 H710 V190" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="570" y="247" text-anchor="middle" class="b">within W_gap</text>

  <text x="55" y="292" class="h">Ingest time</text>
  <line x1="265" y1="280" x2="1715" y2="280" class="axis"/>
  <circle cx="450" cy="280" r="13" fill="#0f766e"/><text x="450" y="268" text-anchor="middle" class="mono">e1</text>
  <circle cx="740" cy="280" r="13" fill="#0f766e"/><text x="740" y="268" text-anchor="middle" class="mono">e2</text>
  <line x1="980" y1="246" x2="980" y2="314" stroke="#d97706" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="980" y="339" text-anchor="middle" class="b">watermark</text>
  <circle cx="1340" cy="280" r="14" fill="#7c3aed"/>
  <circle cx="1620" cy="280" r="14" fill="#dc2626"/>

  <text x="55" y="392" class="h">State</text>
  <rect x="265" y="350" width="285" height="64" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="408" y="391" text-anchor="middle" class="h">Open r</text>
  <rect x="650" y="350" width="320" height="64" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="810" y="391" text-anchor="middle" class="h">Finalized r+1</text>
  <rect x="1070" y="350" width="340" height="64" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1240" y="391" text-anchor="middle" class="h">Late successor r+2</text>
  <rect x="1510" y="350" width="235" height="64" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="1628" y="391" text-anchor="middle" class="h">Closed</text>
  <path d="M550 382 H650" class="violet"/><path d="M970 382 H1070" class="violet"/><path d="M1410 382 H1510" class="violet"/>

  <rect x="265" y="444" width="1145" height="40" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="838" y="475" text-anchor="middle" class="b">Every revision emits one immutable terminal outcome.</text>
  <rect x="1510" y="444" width="235" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1628" y="475" text-anchor="middle" class="h">Late record</text>
</svg>

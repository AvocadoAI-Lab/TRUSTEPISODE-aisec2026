<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      .title{font:700 34px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.zone{font:700 22px Arial,DejaVu Sans,sans-serif;letter-spacing:1px;fill:#475569}.h{font:700 25px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.b{font:400 21px Arial,DejaVu Sans,sans-serif;fill:#334155}.s{font:400 18px Arial,DejaVu Sans,sans-serif;fill:#475569}.mono{font:600 18px 'DejaVu Sans Mono',monospace;fill:#334155}.a{stroke:#334155;stroke-width:3.2;fill:none;marker-end:url(#a)}.blue{stroke:#2563eb;stroke-width:3.4;fill:none;marker-end:url(#ab)}.amber{stroke:#b45309;stroke-width:3.2;stroke-dasharray:10 8;fill:none;marker-end:url(#aa)}.red{stroke:#dc2626;stroke-width:3.2;stroke-dasharray:8 7;fill:none;marker-end:url(#ar)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#b45309"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1800" height="1000" fill="#fff"/>
  <text x="55" y="58" class="title">Campaign-level splits, artifact freeze, and one-pass evaluation</text>

  <!-- Pre-lock phases -->
  <rect x="45" y="95" width="1710" height="230" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="75" y="135" class="zone">PRE-LOCK ENGINEERING AND PILOT</text>
  <rect x="95" y="170" width="360" height="115" rx="16" fill="#fff" stroke="#64748b" stroke-width="2.4"/>
  <text x="275" y="210" text-anchor="middle" class="h">Engineering smoke runs</text>
  <text x="275" y="245" text-anchor="middle" class="s">schema / timestamps / collection</text>
  <text x="275" y="272" text-anchor="middle" class="s">raw-reference checks</text>
  <rect x="565" y="170" width="430" height="115" rx="16" fill="#fff" stroke="#d97706" stroke-width="2.4"/>
  <text x="780" y="210" text-anchor="middle" class="h">Pilot runs</text>
  <text x="780" y="245" text-anchor="middle" class="s">prevalence / masks / source support</text>
  <text x="780" y="272" text-anchor="middle" class="s">episode size / feasibility</text>
  <rect x="1110" y="158" width="570" height="140" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.7"/>
  <text x="1395" y="198" text-anchor="middle" class="h">Freeze before locked collection</text>
  <text x="1395" y="233" text-anchor="middle" class="s">formation · features · label policy · baselines</text>
  <text x="1395" y="264" text-anchor="middle" class="s">perturbation levels · metrics · statistics · group gate</text>
  <path d="M455 227 H565" class="a"/><path d="M995 227 H1110" class="amber"/>

  <!-- Freeze barrier -->
  <line x1="70" y1="355" x2="1730" y2="355" stroke="#7c3aed" stroke-width="6"/>
  <text x="900" y="346" text-anchor="middle" class="zone" fill="#6d28d9">ARTIFACT FREEZE BARRIER</text>

  <!-- Grouped data and splits -->
  <rect x="45" y="395" width="1710" height="430" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="75" y="435" class="zone" fill="#1d4ed8">LOCKED CAMPAIGN / RUN GROUPS - MUTUALLY EXCLUSIVE PARTITIONS</text>

  <rect x="90" y="485" width="285" height="250" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2.6"/>
  <text x="232" y="530" text-anchor="middle" class="h">TRAIN (50%)</text>
  <text x="232" y="575" text-anchor="middle" class="b">fit normalization</text>
  <text x="232" y="610" text-anchor="middle" class="b">fit raw scorer</text>
  <text x="232" y="650" text-anchor="middle" class="s">unweighted log-loss</text>
  <text x="232" y="685" text-anchor="middle" class="s">no calibration fitting</text>

  <rect x="515" y="485" width="285" height="250" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2.6"/>
  <text x="658" y="530" text-anchor="middle" class="h">DEVELOPMENT (20%)</text>
  <text x="658" y="575" text-anchor="middle" class="b">formation policy</text>
  <text x="658" y="610" text-anchor="middle" class="b">features + regularization</text>
  <text x="658" y="650" text-anchor="middle" class="s">model selection only</text>
  <text x="658" y="685" text-anchor="middle" class="s">never inspect locked test</text>

  <rect x="940" y="485" width="320" height="250" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="1100" y="530" text-anchor="middle" class="h">CALIBRATION (15%)</text>
  <text x="1100" y="575" text-anchor="middle" class="b">natural candidate prevalence</text>
  <text x="1100" y="610" text-anchor="middle" class="b">fit affine a_g, b_g</text>
  <text x="1100" y="650" text-anchor="middle" class="s">evaluate preregistered group gate</text>
  <text x="1100" y="685" text-anchor="middle" class="s">no feature selection</text>

  <rect x="1400" y="485" width="285" height="250" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2.6"/>
  <text x="1542" y="530" text-anchor="middle" class="h">LOCKED TEST (15%)</text>
  <text x="1542" y="575" text-anchor="middle" class="b">one frozen evaluation</text>
  <text x="1542" y="610" text-anchor="middle" class="b">tables + figures + CIs</text>
  <text x="1542" y="650" text-anchor="middle" class="s">no tuning or group selection</text>
  <text x="1542" y="685" text-anchor="middle" class="s">test accessed last</text>

  <path d="M375 610 H515" class="blue"/>
  <path d="M800 610 H940" class="blue"/>
  <path d="M1260 610 H1400" class="blue"/>
  <text x="445" y="593" text-anchor="middle" class="s">frozen artifacts</text>
  <text x="870" y="593" text-anchor="middle" class="s">selected model</text>
  <text x="1330" y="593" text-anchor="middle" class="s">frozen calibrator</text>

  <rect x="335" y="760" width="1130" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="900" y="775" text-anchor="middle" class="b">Within scenario × benign-mode strata: ascending SHA-256(20260710:base_campaign_id), cycle 20 = 10/4/3/3</text>
  <text x="900" y="810" text-anchor="middle" class="b">Same run → all episodes, revisions, replay variants, and outage pairs inherit one partition and cluster</text>

  <!-- Change / confirmatory loop -->
  <rect x="220" y="845" width="580" height="105" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="510" y="879" text-anchor="middle" class="h">Method artifact changed?</text>
  <text x="510" y="910" text-anchor="middle" class="s">builder / feature / label / calibrator</text>
  <text x="510" y="937" text-anchor="middle" class="s">old calibrator invalid; old test is no longer unseen</text>
  <rect x="1030" y="845" width="550" height="105" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <text x="1305" y="879" text-anchor="middle" class="h">Collect a new confirmatory test</text>
  <text x="1305" y="910" text-anchor="middle" class="s">new manifest / refit calibration</text>
  <text x="1305" y="937" text-anchor="middle" class="s">one new frozen evaluation</text>
  <path d="M800 900 H1030" class="red"/>
  <path d="M1542 735 V830 H510 V845" class="red"/>

  <rect x="75" y="955" width="1650" height="30" rx="8" fill="#f1f5f9"/>
  <text x="900" y="977" text-anchor="middle" class="s">No event-level or episode-level random split; no test-time threshold, feature, or subgroup selection.</text>
</svg>

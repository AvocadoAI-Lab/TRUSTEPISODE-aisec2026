<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      .title { font: 700 34px Arial, DejaVu Sans, sans-serif; fill: #0f172a; }
      .h { font: 700 24px Arial, DejaVu Sans, sans-serif; fill: #0f172a; }
      .b { font: 400 20px Arial, DejaVu Sans, sans-serif; fill: #334155; }
      .s { font: 400 18px Arial, DejaVu Sans, sans-serif; fill: #475569; }
      .mono { font: 600 18px 'DejaVu Sans Mono', monospace; fill: #334155; }
      .gray { stroke: #334155; stroke-width: 3.1; fill: none; marker-end: url(#a); }
      .blue { stroke: #2563eb; stroke-width: 3.3; fill: none; marker-end: url(#ab); }
      .red { stroke: #dc2626; stroke-width: 3.1; fill: none; marker-end: url(#ar); }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="55" y="58" class="title">Frozen label-blind attach-merge-start decision procedure</text>

  <!-- Input and candidate retrieval -->
  <rect x="55" y="115" width="235" height="110" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <text x="173" y="158" text-anchor="middle" class="h">Incoming record</text>
  <text x="173" y="194" text-anchor="middle" class="s">raw telemetry only</text>

  <rect x="350" y="105" width="320" height="130" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="510" y="146" text-anchor="middle" class="h">Normalize + deduplicate</text>
  <text x="510" y="181" text-anchor="middle" class="s">canonical entities / raw_ref</text>
  <text x="510" y="212" text-anchor="middle" class="s">dependency / root-observation lineage</text>

  <rect x="730" y="105" width="350" height="130" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="905" y="146" text-anchor="middle" class="h">Retrieve open candidates</text>
  <text x="905" y="181" text-anchor="middle" class="mono">within W_gap and W_max</text>
  <text x="905" y="212" text-anchor="middle" class="s">same formation_policy_version</text>

  <polygon points="1335,90 1490,170 1335,250 1180,170" fill="#fffbeb" stroke="#d97706" stroke-width="2.6"/>
  <text x="1335" y="154" text-anchor="middle" class="h">Allowed relation?</text>
  <text x="1335" y="186" text-anchor="middle" class="s">process / session / entity / connection</text>
  <text x="1335" y="214" text-anchor="middle" class="s">time alone is insufficient</text>

  <path d="M290 170 H350" class="blue"/>
  <path d="M670 170 H730" class="blue"/>
  <path d="M1080 170 H1180" class="blue"/>

  <!-- Forbidden inputs callout -->
  <rect x="55" y="315" width="520" height="165" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="8 6"/>
  <text x="315" y="356" text-anchor="middle" class="h" fill="#b91c1c">Forbidden decision inputs</text>
  <text x="315" y="394" text-anchor="middle" class="b" fill="#b91c1c">malicious label / operation or ability ID</text>
  <text x="315" y="429" text-anchor="middle" class="b" fill="#b91c1c">ATT&amp;CK stage / attack window / split</text>
  <text x="315" y="462" text-anchor="middle" class="s" fill="#b91c1c">scorer probability never decides membership</text>

  <!-- Guards -->
  <rect x="650" y="315" width="500" height="150" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="900" y="357" text-anchor="middle" class="h">Apply frozen guards</text>
  <text x="900" y="394" text-anchor="middle" class="b">dependency deduplication / hub suppression</text>
  <text x="900" y="428" text-anchor="middle" class="b">episode-size / giant-component guard</text>
  <text x="900" y="455" text-anchor="middle" class="s">label-blind and deterministic</text>
  <path d="M1335 250 V285 H900 V315" class="blue"/>
  <text x="1160" y="276" class="s" fill="#1d4ed8">yes</text>

  <rect x="1470" y="315" width="280" height="125" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1610" y="357" text-anchor="middle" class="h">No allowed relation</text>
  <text x="1610" y="393" text-anchor="middle" class="b">start new episode</text>
  <text x="1610" y="422" text-anchor="middle" class="s">zero eligible candidates</text>
  <path d="M1490 170 H1610 V315" class="red"/>
  <text x="1515" y="153" class="s" fill="#b91c1c">no</text>

  <!-- Candidate count -->
  <polygon points="900,500 1080,575 900,650 720,575" fill="#f8fafc" stroke="#64748b" stroke-width="2.6"/>
  <text x="900" y="560" text-anchor="middle" class="h">Eligible candidates</text>
  <text x="900" y="594" text-anchor="middle" class="s">after predicates and guards</text>
  <path d="M900 465 V500" class="gray"/>

  <!-- Actions -->
  <rect x="120" y="710" width="360" height="110" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="300" y="753" text-anchor="middle" class="h">0 candidates</text>
  <text x="300" y="789" text-anchor="middle" class="b">start new episode</text>

  <rect x="660" y="710" width="360" height="110" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="840" y="753" text-anchor="middle" class="h">1 candidate</text>
  <text x="840" y="789" text-anchor="middle" class="b">attach event</text>

  <rect x="1200" y="695" width="500" height="140" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1450" y="737" text-anchor="middle" class="h">Multiple candidates</text>
  <text x="1450" y="773" text-anchor="middle" class="b">deterministic tie-break / merge policy</text>
  <text x="1450" y="806" text-anchor="middle" class="s">ordered predicates + stable key</text>

  <path d="M720 575 H300 V710" class="blue"/>
  <text x="505" y="559" class="s" fill="#1d4ed8">0</text>
  <path d="M900 650 V680 H840 V710" class="blue"/>
  <text x="914" y="684" class="s" fill="#1d4ed8">1</text>
  <path d="M1080 575 H1450 V695" class="blue"/>
  <text x="1255" y="559" class="s" fill="#1d4ed8">multiple</text>

  <!-- Single immutable output -->
  <rect x="450" y="855" width="900" height="120" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.6"/>
  <text x="900" y="895" text-anchor="middle" class="h">Emit immutable EpisodeRevision r</text>
  <text x="900" y="929" text-anchor="middle" class="b">event IDs / edges / link_reason / formation_policy_version</text>
  <text x="900" y="959" text-anchor="middle" class="s">accepted late evidence creates revision r+1; prior revisions are never overwritten</text>

  <path d="M300 820 V840 H650 V855" class="gray"/>
  <path d="M840 820 V855" class="gray"/>
  <path d="M1450 835 V840 H1150 V855" class="gray"/>
  <path d="M1610 440 H1750 V915 H1350" class="red"/>
</svg>

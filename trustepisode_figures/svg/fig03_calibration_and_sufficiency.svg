<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .title { font: 700 34px Arial, DejaVu Sans, sans-serif; fill: #0f172a; }
      .zone { font: 700 22px Arial, DejaVu Sans, sans-serif; letter-spacing: 1.2px; fill: #475569; }
      .h { font: 700 26px Arial, DejaVu Sans, sans-serif; fill: #0f172a; }
      .b { font: 400 21px Arial, DejaVu Sans, sans-serif; fill: #334155; }
      .s { font: 400 18px Arial, DejaVu Sans, sans-serif; fill: #475569; }
      .mono { font: 600 19px 'DejaVu Sans Mono', monospace; fill: #334155; }
      .gray { stroke: #334155; stroke-width: 3.1; fill: none; marker-end: url(#a); }
      .violet { stroke: #7c3aed; stroke-width: 3.3; fill: none; marker-end: url(#av); }
      .teal { stroke: #0f766e; stroke-width: 3.3; fill: none; marker-end: url(#at); }
      .red { stroke: #dc2626; stroke-width: 3.1; fill: none; marker-end: url(#ar); }
      .dash { stroke-dasharray: 8 7; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <marker id="av" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#7c3aed"/></marker>
    <marker id="at" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0f766e"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1800" height="980" fill="#ffffff"/>
  <text x="55" y="58" class="title">Scoped probability calibration and independent evidence sufficiency</text>

  <!-- Probability lane -->
  <rect x="45" y="90" width="1710" height="395" rx="24" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2.4"/>
  <text x="75" y="130" class="zone">PROBABILITY LANE - ONLY THE CALIBRATOR PRODUCES P</text>

  <rect x="80" y="170" width="230" height="120" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="195" y="211" text-anchor="middle" class="h">Features</text>
  <text x="195" y="249" text-anchor="middle" class="b">D, C</text>
  <text x="195" y="277" text-anchor="middle" class="s">no health input</text>

  <rect x="370" y="170" width="260" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="500" y="211" text-anchor="middle" class="h">Stateless scorer</text>
  <text x="500" y="251" text-anchor="middle" class="mono">z = b + wD D + wC C</text>

  <rect x="80" y="345" width="300" height="100" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="230" y="383" text-anchor="middle" class="b">mask m / health h / detector state</text>
  <text x="230" y="416" text-anchor="middle" class="s">pipeline, feature, model, label versions</text>

  <rect x="450" y="330" width="310" height="130" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="605" y="371" text-anchor="middle" class="h">Scope resolver</text>
  <text x="605" y="408" text-anchor="middle" class="mono">kappa = scope(m, h, detector, versions)</text>
  <text x="605" y="438" text-anchor="middle" class="s">exact manifest match only</text>

  <polygon points="960,285 1115,365 960,445 805,365" fill="#fffbeb" stroke="#d97706" stroke-width="2.6"/>
  <text x="960" y="350" text-anchor="middle" class="h">Supported?</text>
  <text x="960" y="383" text-anchor="middle" class="s">mask + manifest + gate</text>

  <rect x="1180" y="155" width="300" height="135" rx="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.7"/>
  <text x="1330" y="197" text-anchor="middle" class="h">Affine calibrator</text>
  <text x="1330" y="235" text-anchor="middle" class="mono">P = sigmoid(a_g z + b_g)</text>
  <text x="1330" y="265" text-anchor="middle" class="s">validated only in supported g</text>

  <rect x="1580" y="170" width="110" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.7"/>
  <text x="1635" y="235" text-anchor="middle" class="h">P</text>

  <rect x="1180" y="335" width="510" height="125" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1435" y="371" text-anchor="middle" class="h">Out of support</text>
  <text x="1435" y="402" text-anchor="middle" class="mono">status=out_of_support</text>
  <text x="1435" y="428" text-anchor="middle" class="mono">decision_eligible=false</text>
  <text x="1435" y="451" text-anchor="middle" class="s">z is not a validated probability</text>

  <path d="M310 230 H370" class="gray"/>
  <path d="M630 230 H1180" class="gray"/>
  <text x="875" y="215" text-anchor="middle" class="s">raw logit z</text>
  <path d="M380 395 H450" class="violet"/>
  <path d="M760 395 H790 V365 H805" class="violet"/>
  <path d="M960 285 H1180" class="violet"/>
  <text x="1060" y="270" class="s" fill="#6d28d9">yes</text>
  <path d="M1115 365 H1180" class="red"/>
  <text x="1132" y="349" class="s" fill="#b91c1c">no</text>
  <path d="M1480 223 H1580" class="violet"/>

  <!-- Sufficiency lane -->
  <rect x="45" y="520" width="1710" height="285" rx="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.4"/>
  <text x="75" y="560" class="zone">SUFFICIENCY LANE - MULTI-AXIS PROFILE, NOT A SECOND PROBABILITY</text>
  <text x="1690" y="560" text-anchor="end" class="s" fill="#b91c1c">No numerical path from U to P.</text>

  <rect x="80" y="615" width="410" height="130" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="285" y="655" text-anchor="middle" class="h">Evidence conditions</text>
  <text x="285" y="691" text-anchor="middle" class="s">SourceCoverage + EpisodeRevision</text>
  <text x="285" y="722" text-anchor="middle" class="s">provenance / lateness / contradictions</text>

  <rect x="600" y="600" width="410" height="160" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="805" y="641" text-anchor="middle" class="h">Sufficiency evaluator</text>
  <text x="805" y="678" text-anchor="middle" class="s">deterministic versioned rules</text>
  <text x="805" y="710" text-anchor="middle" class="s">+ resolved calibration status</text>
  <text x="805" y="741" text-anchor="middle" class="s">fields may co-occur</text>

  <rect x="1120" y="590" width="470" height="180" rx="17" fill="#d1fae5" stroke="#0f766e" stroke-width="2.7"/>
  <text x="1355" y="632" text-anchor="middle" class="h">Structured U</text>
  <text x="1355" y="671" text-anchor="middle" class="b">coverage / provenance / lateness</text>
  <text x="1355" y="707" text-anchor="middle" class="b">contradiction / calibration support</text>
  <text x="1355" y="744" text-anchor="middle" class="s">not scalar; never weighted into P</text>

  <path d="M490 680 H600" class="teal"/>
  <path d="M1010 680 H1120" class="teal"/>
  <path d="M605 460 V505 H880 V600" class="violet dash"/>
  <text x="700" y="500" class="s" fill="#6d28d9">support status only</text>

  <!-- Co-recording boundary -->
  <rect x="450" y="855" width="900" height="90" rx="17" fill="#ffffff" stroke="#475569" stroke-width="2.6"/>
  <text x="900" y="893" text-anchor="middle" class="h">AuditRecord Assembler output</text>
  <text x="900" y="925" text-anchor="middle" class="s">P and U are co-recorded once; the append-only store is sink-only and never rewrites P.</text>
  <path d="M1635 275 H1720 V900 H1350" class="violet"/>
  <path d="M1355 770 V855" class="teal"/>
</svg>

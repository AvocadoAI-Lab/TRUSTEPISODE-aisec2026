<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <style>
      .title{font:700 34px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.zone{font:700 22px Arial,DejaVu Sans,sans-serif;letter-spacing:1px;fill:#475569}.h{font:700 26px Arial,DejaVu Sans,sans-serif;fill:#0f172a}.b{font:400 22px Arial,DejaVu Sans,sans-serif;fill:#334155}.s{font:400 19px Arial,DejaVu Sans,sans-serif;fill:#475569}.mono{font:600 19px 'DejaVu Sans Mono',monospace;fill:#334155}.a{stroke:#334155;stroke-width:3.2;fill:none;marker-end:url(#a)}.blue{stroke:#2563eb;stroke-width:3.4;fill:none;marker-end:url(#ab)}.amber{stroke:#b45309;stroke-width:3.2;stroke-dasharray:10 8;fill:none;marker-end:url(#aa)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#b45309"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#fff"/>
  <text x="55" y="58" class="title">Ground Truth Firewall and offline label join</text>

  <!-- Online lane -->
  <rect x="45" y="95" width="1040" height="700" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="75" y="135" class="zone" fill="#1d4ed8">ONLINE INFERENCE ROLE - LABEL BLIND</text>
  <rect x="90" y="190" width="230" height="110" rx="15" fill="#fff" stroke="#2563eb" stroke-width="2.3"/>
  <text x="205" y="232" text-anchor="middle" class="h">Telemetry</text><text x="205" y="267" text-anchor="middle" class="s">events + health</text>
  <rect x="385" y="180" width="285" height="130" rx="15" fill="#fff" stroke="#2563eb" stroke-width="2.3"/>
  <text x="528" y="222" text-anchor="middle" class="h">TrustEpisode</text>
  <text x="528" y="257" text-anchor="middle" class="s">fabric → episode → score</text>
  <text x="528" y="286" text-anchor="middle" class="s">calibration + U</text>
  <rect x="735" y="180" width="300" height="130" rx="15" fill="#fff" stroke="#475569" stroke-width="2.3"/>
  <text x="885" y="222" text-anchor="middle" class="h">Emitted outputs</text>
  <text x="885" y="257" text-anchor="middle" class="s">EpisodeRevision</text>
  <text x="885" y="286" text-anchor="middle" class="s">AuditRecord or assembly failure</text>
  <path d="M320 245 H385" class="blue"/><path d="M670 245 H735" class="blue"/>

  <rect x="110" y="390" width="900" height="315" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="432" text-anchor="middle" class="h">Automated online-schema checks</text>
  <text x="150" y="480" class="mono">Allowed:</text>
  <text x="300" y="480" class="b">event IDs · timestamps · source IDs · entities · actions · raw refs</text>
  <text x="150" y="528" class="mono" fill="#b91c1c">Forbidden:</text>
  <text x="300" y="528" class="b" fill="#b91c1c">operation_id · ability_id · adversary_profile · technique_label</text>
  <text x="300" y="566" class="b" fill="#b91c1c">attack marker / window · scenario_class · malicious_label</text>
  <text x="300" y="600" class="b" fill="#b91c1c">split_assignment</text>
  <rect x="220" y="625" width="680" height="55" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.3"/>
  <text x="560" y="660" text-anchor="middle" class="s" fill="#b91c1c">Reject record or fail the test when any forbidden field is present</text>

  <!-- Firewall -->
  <line x1="1125" y1="100" x2="1125" y2="795" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="1105" y="130" text-anchor="end" class="zone" fill="#b91c1c">FIREWALL</text>
  <line x1="1097" y1="390" x2="1153" y2="446" stroke="#dc2626" stroke-width="5"/>
  <line x1="1153" y1="390" x2="1097" y2="446" stroke="#dc2626" stroke-width="5"/>

  <!-- Offline lane -->
  <rect x="1170" y="95" width="585" height="700" rx="24" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="1200" y="135" class="zone" fill="#92400e">OFFLINE EVALUATION ROLE</text>
  <rect x="1220" y="185" width="485" height="180" rx="16" fill="#fff" stroke="#d97706" stroke-width="2.5"/>
  <text x="1462" y="227" text-anchor="middle" class="h">Ground Truth Store</text>
  <text x="1462" y="264" text-anchor="middle" class="s">Caldera + benign workload manifests</text>
  <text x="1462" y="301" text-anchor="middle" class="s">versioned GT fields and run metadata</text>
  <text x="1462" y="335" text-anchor="middle" class="mono">offline database role only</text>

  <rect x="1220" y="455" width="485" height="185" rx="16" fill="#fff" stroke="#d97706" stroke-width="2.5"/>
  <text x="1462" y="497" text-anchor="middle" class="h">Evaluation Harness</text>
  <text x="1462" y="535" text-anchor="middle" class="s">join after online inference</text>
  <text x="1462" y="570" text-anchor="middle" class="s">frozen label_policy_version</text>
  <text x="1462" y="607" text-anchor="middle" class="b">positive · negative · mixed · ambiguous</text>
  <path d="M1462 365 V455" class="amber"/>

  <!-- Output-to-eval route around firewall, after inference -->
  <path d="M885 310 V340 H1055 V835 H1185 V548 H1220" class="a"/>
  <text x="1030" y="860" class="s">immutable online outputs only</text>

  <rect x="1215" y="690" width="495" height="70" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1462" y="720" text-anchor="middle" class="b">Metrics and labels never feed back</text>
  <text x="1462" y="748" text-anchor="middle" class="s">to Evidence Fabric, episode formation, features, or scores</text>
</svg>
